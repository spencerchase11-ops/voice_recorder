name: lame_mp3
description: "Streaming MP3 (CBR) encoder for Flutter on Android and iOS: the LAME 4.0 encoder exposed to Dart through dart:ffi."
version: 0.1.0
# Local package of the voice_recorder app; it vendors LGPL code (src/lame).
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # FFI plugin: the Flutter tooling builds src/ with CMake through Gradle on
  # Android (android/build.gradle) and with CocoaPods/Xcode on iOS
  # (ios/lame_mp3.podspec), and bundles the resulting library with the app.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
