name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/lame_mp3/lib packages/lame_mp3/test
      - run: flutter analyze
      - name: Build LAME for the host (MP3 encoder tests)
        run: packages/lame_mp3/tool/build_host_lib.sh
      - name: App tests (unit, widget, golden)
        run: flutter test
      - name: lame_mp3 plugin tests
        working-directory: packages/lame_mp3
        run: flutter test
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Test builds are signed with a debug key (no android/key.properties in
      # CI): fine for sideloading and testing, not for Play uploads. Keep the
      # same key from run to run so a new test APK installs as an update over
      # the previous one (Android refuses updates signed with another key).
      - name: Reuse the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-test-signing-key-v1
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voice-recorder-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build (no code signing)
    # macOS minutes are expensive: run on main and on demand only.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
