name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly: keeps the test signing key's cache in use (see the android job).
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  # A manual run replaces the push run of the same commit (it builds iOS
  # too); the weekly run stands apart.
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'build' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/lame_mp3/lib packages/lame_mp3/test
      - run: flutter analyze
      - name: Build LAME for the host (MP3 encoder tests)
        run: packages/lame_mp3/tool/build_host_lib.sh
      - name: App tests (unit, widget, golden)
        run: flutter test
      - name: lame_mp3 plugin tests
        working-directory: packages/lame_mp3
        run: flutter test
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  android:
    name: Android build
    # Only a commit that passes its tests gets an APK for the phone.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Test builds are signed with a test key that only CI has: fine for
      # sideloading and testing, not for Play uploads (its "Android Debug"
      # certificate makes Play reject them, like any debug build). The key is
      # kept in the Actions cache so each new test APK installs as an update
      # over the previous one; Android refuses an update signed with another
      # key. GitHub deletes a cache that goes unused for 7 days (then the next
      # APK would get a new key): the weekly run below keeps it in use.
      - name: Restore the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.voice-recorder-test-key
          key: android-test-signing-key-v2
      - name: Sign with the test key
        run: |
          key="$HOME/.voice-recorder-test-key/test.jks"
          if [ ! -f "$key" ]; then
            mkdir -p "$(dirname "$key")"
            keytool -genkeypair -keystore "$key" -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          printf '%s\n' storePassword=android keyPassword=android \
            keyAlias=androiddebugkey "storeFile=$key" > android/key.properties
      # The run number becomes the version code, so Settings → About shows
      # which test build is installed.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-recorder-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  keep-signing-key:
    name: Keep the test signing key
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restore the test signing key (counts as a use)
        uses: actions/cache/restore@v4
        with:
          path: ~/.voice-recorder-test-key
          key: android-test-signing-key-v2

  ios:
    name: iOS build (no code signing)
    # macOS minutes are expensive: run on demand (Actions > CI > Run
    # workflow) and on main only.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
