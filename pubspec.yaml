name: voice_recorder
description: "Voice Recorder - a faithful revival of the classic 2016 voice recorder."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  audio_session: ^0.2.4
  just_audio: ^0.10.6
  lame_mp3:
    path: packages/lame_mp3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/licenses/
    - assets/fonts/Roboto-LICENSE.txt

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
